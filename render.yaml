services:
  - type: web
    name: financial-chatbot-frontend
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_USE_DEMO
        value: "true"
      - key: SEC_USER_AGENT
        sync: false
      # Set your RAG API URL when the backend is live:
      # - key: RAG_API_BASE_URL
      #   value: https://your-api.onrender.com
