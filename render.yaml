services:
  - type: web
    name: financial-chatbot-frontend
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_USE_DEMO
        value: "false"
      - key: SEC_USER_AGENT
        sync: false
      - key: RAG_API_BASE_URL
        sync: false
